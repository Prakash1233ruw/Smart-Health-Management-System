# Gemini configuration \u2014 keep the actual key in your run environment
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-3.1-flash-lite}

ai.connect-timeout-seconds=${AI_CONNECT_TIMEOUT_SECONDS:5}
ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:30}
ai.save-history=${AI_SAVE_HISTORY:false}

# Successful change analyses are always persisted for doctor review.
health-timeline.enabled=${HEALTH_TIMELINE_ENABLED:true}
health-timeline.metrics-history-limit=${HEALTH_TIMELINE_METRICS_HISTORY_LIMIT:5}
health-timeline.max-page-size=${HEALTH_TIMELINE_MAX_PAGE_SIZE:100}
